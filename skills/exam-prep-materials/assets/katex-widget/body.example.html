<p><b>짧은 답:</b> 정상 상태에서 흐름은 어디서나 같다. 쌓이는 곳이 없기 때문이다.</p>
<p>막 안에서 $\partial c/\partial t = D\,\partial^2 c/\partial x^2$이고, 정상 상태는 $\partial c/\partial t=0$이므로</p>
$$c''(x)=0 \;\Rightarrow\; c(x)=c_0+(c_L-c_0)\,\frac{x}{L},\qquad J=-D\,c'(x)=D\,\frac{c_0-c_L}{L}.$$
<p class="note">여기서 $c_0 \gt c_L$이면 $J\gt 0$: 흐름은 $x$가 커지는 쪽이다.</p>
